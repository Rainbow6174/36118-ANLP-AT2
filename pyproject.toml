[project]
name = "anlp-at2"
version = "0.1.0"
description = "English variety-aware sentiment and sarcasm classification"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
