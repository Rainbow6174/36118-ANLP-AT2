[project]
name = "crisis-lens"
version = "0.1.0"
description = "NLP-assisted organisation of new disaster messages"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "nicegui==3.17.1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "pydantic>=2.7,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "seaborn>=0.13,<1",
    "sentence-transformers>=5,<6",
    "torch>=2.2,<3",
    "transformers>=4.40,<5",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff.lint.per-file-ignores]
"app/frontend/layout.py" = ["SIM117"]
"app/frontend/pages/*.py" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
