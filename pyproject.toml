[project]
name = "crisis-lens"
version = "0.1.0"
description = "NLP-assisted organisation of new disaster messages"
requires-python = ">=3.11"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
